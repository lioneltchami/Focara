name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag version ($TAG) must match package.json version ($VERSION)."
            exit 1
          fi
      - run: npm run typecheck
      - run: npm test

      - name: Capture helper (Windows)
        if: runner.os == 'Windows'
        run: |
          cargo test --manifest-path native/win/Cargo.toml
          cargo build --release --manifest-path native/win/Cargo.toml
      - name: Capture helper (macOS)
        if: runner.os == 'macOS'
        run: |
          UNIVERSAL=1 zsh native/mac/build.sh
          zsh native/mac/test.sh

      - name: End-to-end selftest (synthetic recording → zoom → save/open → export → preview parity, audio sync)
        run: npm run selftest
      - name: UI test (real UI driven by DOM events)
        shell: bash
        run: |
          cp -R "examples/Örnek Proje.odak" "$RUNNER_TEMP/ui.odak"
          npm run uitest -- "$RUNNER_TEMP/ui.odak"
      - name: UI test in English (the same flows; no Turkish text may be left anywhere)
        shell: bash
        run: |
          cp -R "examples/Örnek Proje.odak" "$RUNNER_TEMP/ui-en.odak"
          npx electron . --uitest "$RUNNER_TEMP/ui-en.odak" --lang en
      - name: Performance test (heavy project in the real editor; CI machines have no GPU, so report only)
        run: npm run perftest -- --perf-report
      - name: Capture helper smoke test (records 3 s of this machine's screen)
        run: node scripts/helper-smoke.mjs

      - name: Require macOS signing and notarization secrets for releases
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          missing=0
          for name in MAC_CSC_LINK MAC_CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required Actions secret $name is not configured."
              missing=1
            fi
          done
          exit "$missing"

      - name: Package signed and notarized macOS release
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v')
        run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      - name: Package unsigned build (non-release macOS and Windows)
        if: runner.os != 'macOS' || !startsWith(github.ref, 'refs/tags/v')
        run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: Focara-${{ runner.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download platform installers
        uses: actions/download-artifact@v4
        with:
          pattern: Focara-*
          path: release
          merge-multiple: true

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*
          generate_release_notes: true

  homebrew:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Homebrew tap cask
        env:
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${HOMEBREW_TAP_DEPLOY_KEY:-}" ]; then
            echo "::notice::HOMEBREW_TAP_DEPLOY_KEY is not configured; skipping Homebrew tap update."
            exit 0
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          TMP="$(mktemp -d)"
          curl -fsSL -o "$TMP/Focara-arm64.dmg" \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/Focara-${VERSION}-mac-arm64.dmg"
          curl -fsSL -o "$TMP/Focara-x64.dmg" \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/Focara-${VERSION}-mac-x64.dmg"
          ARM_SHA="$(sha256sum "$TMP/Focara-arm64.dmg" | awk '{print $1}')"
          INTEL_SHA="$(sha256sum "$TMP/Focara-x64.dmg" | awk '{print $1}')"
          bash scripts/update-homebrew-cask.sh "$VERSION" "$ARM_SHA" "$INTEL_SHA"
