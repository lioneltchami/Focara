[package]
name = "odak-capture"
version = "0.1.0"
edition = "2021"
description = "Odak screen/cursor/audio capture helper for Windows"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-capture = "2.0.1"
windows = { version = "0.62", features = [
  "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Performance", "Win32_Media", "Win32_Media_Audio",
  "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Devices_FunctionDiscovery",
  "Win32_UI_Shell_PropertiesSystem", "Win32_Media_KernelStreaming", "Win32_Media_Multimedia", "Win32_System_Threading",
] }

[profile.release]
opt-level = 3
lto = true
